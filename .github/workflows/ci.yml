name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: regdata-platform

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: regdata-platform/.nvmrc

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Lint
        run: ../.github/scripts/run-and-annotate.sh Lint npm run lint

      - name: Test
        run: ../.github/scripts/run-and-annotate.sh Test npm test

      - name: Typecheck
        run: ../.github/scripts/run-and-annotate.sh Typecheck npm run typecheck

      - name: Build
        run: ../.github/scripts/run-and-annotate.sh Build npm run build
